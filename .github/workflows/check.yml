name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Test Markdown checker
        run: python3 -B -m unittest discover -s tests/scripts -p 'test_*.py'

      - name: Test training tools
        run: python3 -B -m unittest discover -s tools/train -p 'test_*.py'

      - name: Check tracked Markdown links and anchors
        run: python3 -B tests/scripts/check_markdown_links.py --repo-root .

      - name: Check whitespace against the first parent
        run: git diff --check HEAD^ HEAD

  rust-lint:
    name: Rust formatting, Clippy, and docs
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        run: |
          rustup toolchain install --no-self-update
          rustc --version --verbose

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run Clippy without optional features
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Check the dependent crate with rustfmt and Clippy
        run: |
          cargo fmt --check --manifest-path tests/downstream/Cargo.toml
          cargo clippy --all-targets --locked --manifest-path tests/downstream/Cargo.toml -- -D warnings

      - name: Check Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps --locked

  rust-test:
    name: Rust build and tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
          - arch: riscv64
            runner: ubuntu-24.04-riscv
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          actual_arch="$(uname -m)"
          if [[ "$actual_arch" != "$EXPECTED_ARCH" ]]; then
            echo "Expected $EXPECTED_ARCH, runner reports $actual_arch" >&2
            exit 1
          fi

      - name: Install pinned Rust
        run: |
          rustup toolchain install --no-self-update
          rustc --version --verbose

      - name: Build
        run: cargo build --all-targets --all-features --locked

      - name: Run tests
        run: cargo test --all-features --locked

      - name: Report the kernel backends that the tests executed
        run: cargo test --all-features --locked --lib backends_are_reported -- --nocapture

      - name: Check the detected kernel backends with the self-test example
        run: cargo run --all-features --locked --example kernel_self_test

      - name: Check that the Tokio example decides like the synchronous one
        # `bash` runs with `pipefail`. The last line is longer than the
        # inline limit, so `detect_async` decides it on the blocking pool.
        shell: bash
        run: |
          {
            grep -v -e '^#' -e '^$' tests/data/attacks.tsv | cut -f2-
            cat tests/data/benign.txt
            python3 -c 'print("a" * 20000 + "<script>alert(1)</script>")'
          } > lines.txt
          for preset in fast balanced thorough strict; do
            cargo run --all-features --locked --example detect "$preset" < lines.txt > sync.txt
            cargo run --all-features --locked --example detect_async "$preset" < lines.txt > async.txt
            cmp sync.txt async.txt
          done
          rm lines.txt sync.txt async.txt

      - name: Run the benchmark as a smoke test
        run: cargo test --all-features --locked --bench score

      - name: Train a model while compiling a dependent crate
        run: cargo test --locked --manifest-path tests/downstream/Cargo.toml

      - name: Check that the dependent crate trains again only on a change
        # `bash` runs with `pipefail`, so a failing build is not hidden by `tee`.
        shell: bash
        run: |
          manifest=tests/downstream/Cargo.toml
          cargo build --locked --manifest-path "$manifest"
          cargo build -v --locked --manifest-path "$manifest" 2>&1 | tee unchanged.log
          grep -q 'Fresh s2fp-downstream' unchanged.log
          touch tests/data/benign.txt
          cargo build -v --locked --manifest-path "$manifest" 2>&1 | tee changed.log
          grep -q 'Dirty s2fp-downstream.*benign.txt. has changed' changed.log
          rm unchanged.log changed.log
