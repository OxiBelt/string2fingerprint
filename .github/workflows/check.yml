name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Test Markdown checker
        run: python3 -B -m unittest discover -s tests/scripts -p 'test_*.py'

      - name: Test training tools
        run: python3 -B -m unittest discover -s tools/train -p 'test_*.py'

      - name: Check tracked Markdown links and anchors
        run: python3 -B tests/scripts/check_markdown_links.py --repo-root .

      - name: Check whitespace against the first parent
        run: git diff --check HEAD^ HEAD

  rust-lint:
    name: Rust formatting, Clippy, and docs
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        run: |
          rustup toolchain install --no-self-update
          rustc --version --verbose

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Check Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps --locked

  rust-test:
    name: Rust build and tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
          - arch: riscv64
            runner: ubuntu-24.04-riscv
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          actual_arch="$(uname -m)"
          if [[ "$actual_arch" != "$EXPECTED_ARCH" ]]; then
            echo "Expected $EXPECTED_ARCH, runner reports $actual_arch" >&2
            exit 1
          fi

      - name: Install pinned Rust
        run: |
          rustup toolchain install --no-self-update
          rustc --version --verbose

      - name: Build
        run: cargo build --all-targets --all-features --locked

      - name: Run tests
        run: cargo test --all-features --locked

      - name: Report the kernel backends that the tests executed
        run: cargo test --all-features --locked --lib backends_are_reported -- --nocapture

      - name: Run the benchmark as a smoke test
        run: cargo test --all-features --locked --bench score
