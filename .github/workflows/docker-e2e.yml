name: Docker end-to-end checks

# Builds the image of `tests/docker/Dockerfile` from a clean copy of the
# repository and runs `tests/docker/e2e.sh` on each native architecture.
# Scores and trained models must not depend on the CPU, so the last job
# compares the digests of the outputs of every architecture.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Docker end-to-end (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          actual_arch="$(uname -m)"
          if [[ "$actual_arch" != "$EXPECTED_ARCH" ]]; then
            echo "Expected $EXPECTED_ARCH, runner reports $actual_arch" >&2
            exit 1
          fi
          docker version

      - name: Build the image and run the end-to-end checks
        env:
          ARCH: ${{ matrix.arch }}
        run: tests/docker/e2e.sh --digests "digests-$ARCH.txt"

      - name: Upload the digests of the outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: digests-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 7

  same-outputs:
    name: Same outputs on every architecture
    needs: e2e
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true

      - name: Compare the digests
        run: |
          ls digests-*.txt
          if diff -u digests-x86_64.txt digests-aarch64.txt; then
            echo "$(wc -l < digests-x86_64.txt) outputs are the same on x86-64 and Arm64"
          else
            echo "Some outputs differ between x86-64 and Arm64" >&2
            exit 1
          fi
