name: Sanitizers

# Runs the tests under AddressSanitizer, which also checks for leaks, on
# native x86-64 and Arm64 runners, so that every SIMD kernel that the CPU
# supports reads only memory that it may read. Sanitizers need a nightly
# toolchain. The date is pinned, so that a result does not depend on the
# day it ran. Move it forward from time to time.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Takes precedence over `rust-toolchain.toml`.
  RUSTUP_TOOLCHAIN: nightly-2026-11-28

jobs:
  address:
    name: AddressSanitizer (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    env:
      RUSTFLAGS: -Zsanitizer=address
      RUSTDOCFLAGS: -Zsanitizer=address
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          actual_arch="$(uname -m)"
          if [[ "$actual_arch" != "$EXPECTED_ARCH" ]]; then
            echo "Expected $EXPECTED_ARCH, runner reports $actual_arch" >&2
            exit 1
          fi

      - name: Lower the address randomization for the sanitizer runtime
        # Runner kernels randomize `mmap` with more bits than the shadow
        # memory layout of AddressSanitizer allows, and an instrumented
        # program then crashes with SIGSEGV before `main`. 28 bits work on
        # both architectures.
        run: |
          sudo sysctl vm.mmap_rnd_bits
          sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Install the pinned nightly toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src --no-self-update
          rustc --version --verbose

      - name: Report the kernel backends that the tests execute
        env:
          ARCH: ${{ matrix.arch }}
        run: >-
          cargo test -Zbuild-std --target "$ARCH-unknown-linux-gnu" --all-features --locked
          --lib backends_are_reported -- --nocapture

      - name: Run the tests under AddressSanitizer
        env:
          ARCH: ${{ matrix.arch }}
        # The standard library is rebuilt with the sanitizer, so that memory
        # that it allocates is checked too. Documentation tests are left
        # out, since they would need the same.
        run: cargo test -Zbuild-std --target "$ARCH-unknown-linux-gnu" --all-features --locked --lib --tests

      - name: Run the kernel self-test under AddressSanitizer
        env:
          ARCH: ${{ matrix.arch }}
        run: cargo run -Zbuild-std --target "$ARCH-unknown-linux-gnu" --all-features --locked --example kernel_self_test
