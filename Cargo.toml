[package]
name = "string2fingerprint"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
description = "Scores untrusted text for malformed content and escape attempts using SIMD fingerprinting"
repository = "https://github.com/OxiBelt/string2fingerprint"
publish = false

[features]
# Training of models on labeled samples, in `string2fingerprint::train`.
train = []
# Training of a model in the build script of a dependent crate, in
# `string2fingerprint::build`.
build = ["train"]
# Asynchronous scoring and detection on Tokio, in
# `string2fingerprint::tokio`. Work that would hold a runtime worker runs on
# Tokio's blocking pool, which needs Tokio's `rt` feature; that adds no
# dependency, and an application that runs a Tokio runtime enables it
# already.
tokio = ["dep:tokio", "tokio/rt"]

[dependencies]
# The runtime is the caller's: the I/O traits need no Tokio feature, and
# `rt` gives the blocking pool and the cooperative scheduling budget.
tokio = { version = "1.54.1", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "io-util", "io-std", "fs"] }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[[bench]]
name = "score"
harness = false

[[example]]
name = "train"
required-features = ["train"]

[[example]]
name = "detect_async"
required-features = ["tokio"]

[[test]]
name = "tokio"
required-features = ["tokio"]
