# A crate that depends on `string2fingerprint` and trains its model while it
# is compiled, the way `string2fingerprint::build` documents. CI builds and
# tests it, so that the `build` feature is checked from a dependent crate.
[package]
name = "s2fp-downstream"
version = "0.0.0"
edition = "2024"
publish = false

# The fixture is a workspace of its own.
[workspace]

[dependencies]
string2fingerprint = { path = "../.." }

[build-dependencies]
string2fingerprint = { path = "../..", features = ["build"] }

# Cargo compiles build dependencies without optimization unless told
# otherwise, which makes training many times slower.
[profile.dev.package.string2fingerprint]
opt-level = 3

[profile.release.package.string2fingerprint]
opt-level = 3
